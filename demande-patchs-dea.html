<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071d32"><title>Demande de patchs DEA — CS Oupeye</title><link rel="icon" href="icons/favicon-32.png"><link rel="stylesheet" href="demande-materiel.css?v=1"><link rel="stylesheet" href="demande-patchs-dea.css?v=1"><script type="module" src="demande-materiel.js?v=2"></script></head>
<body><header>CS Oupeye <span>Réapprovisionnement des patchs DEA</span></header><main><p class="eyebrow">APRÈS UTILISATION DU DEA</p><h1>Demande de patchs DEA</h1><p>Complétez ces trois informations pour demander le remplacement des patchs.</p>
<form id="request-form"><input type="hidden" name="requestType" value="dea">
<label for="intervention-date">Date de l’intervention</label><div class="date-picker-field"><input id="intervention-date" name="interventionDate" type="date" required><button id="date-picker" type="button" aria-label="Choisir la date dans le calendrier"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 11h18"/></svg></button></div>
<label>Numéro de course 112<input name="missionNumber" type="text" maxlength="100" placeholder="Numéro de la course" required></label>
<label>Nom des ambulanciers<textarea name="crewNames" rows="2" maxlength="200" autocomplete="off" placeholder="Noms des ambulanciers de l’équipage" required></textarea></label>
<div class="honeypot" aria-hidden="true"><label>Site web<input name="website" tabindex="-1" autocomplete="off"></label></div><p id="request-status" role="status" aria-live="polite"></p><button id="send-request" type="submit">Demander des patchs DEA</button></form>
<section id="request-success" hidden tabindex="-1"><h2>Demande envoyée ✓</h2><p>Votre demande de patchs DEA est enregistrée et disponible pour le responsable.</p><button id="another-request" type="button">Faire une autre demande</button></section></main><footer>CS Oupeye · Patchs DEA</footer></body></html>
