<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071d32">
  <meta name="description" content="Page temporairement indisponible - CS Oupeye">
  <title>Page temporairement indisponible - CS Oupeye®</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #dc3545;
      --text-color: #000; /* Texte en noir */
      --bg-color: #f5f5f5;
      --border-radius: 6px;
    }
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Roboto', sans-serif;
    }
    .container {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    /* Image de fond réduite de 30% grâce au scale(0.7) */
    .bg-image {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.5;
      transform: translate(-50%, -50%) scale(0.7);
      transform-origin: center;
    }
    /* Overlay pour le texte en surimpression */
    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-color);
      /* Si besoin, ajoutez ici une ombre légère pour le texte */
      /* text-shadow: 2px 2px 4px rgba(255,255,255,0.8); */
    }
    .overlay h1 {
      font-size: 3em;
      margin: 0;
    }
    .overlay p {
      font-size: 2em;
      margin: 10px 0 0;
    }
  </style>
  <link rel="stylesheet" href="../final-pages-modern.css">
</head>
<body class="nowork-page">
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="../index.html">CS Oupeye®</a>
      <nav class="main-nav" aria-label="Navigation principale">
        <a class="nav-link" href="../index.html">Accueil</a>
        <a class="nav-link" href="../operation.html">Documentation</a>
        <a class="nav-link" href="../checklist.html">Checklists</a>
      </nav>
      <a class="header-back" href="../index.html"><span aria-hidden="true">←</span> Retour à l’accueil</a>
    </div>
  </header>

  <main class="maintenance-main">
    <section class="maintenance-card" aria-labelledby="maintenance-title">
      <div class="maintenance-visual"><img src="images/unicorn_image.jpg" alt="Illustration de maintenance"></div>
      <div class="maintenance-copy">
        <span class="maintenance-badge">Maintenance en cours</span>
        <h1 id="maintenance-title">Cette page revient bientôt.</h1>
        <p>La ressource demandée est temporairement indisponible. Réessayez un peu plus tard ou contactez l’administrateur du portail.</p>
        <div class="maintenance-actions">
          <a class="maintenance-button" href="../index.html">Retour à l’accueil</a>
          <a class="maintenance-button secondary" href="javascript:history.back()">Page précédente</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
