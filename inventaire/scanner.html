<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071d32">
  <meta name="description" content="Scanner de l’inventaire du CS Oupeye">
  <title>Scanner — CS Oupeye</title>
  <link rel="icon" href="../icons/favicon-32.png">
  <link rel="stylesheet" href="inventory-app.css?v=2">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <script type="module" src="scanner-app.js?v=2"></script>
</head>
<body>
  <header class="site-header"><a class="brand" href="../index.html">CS Oupeye<span>Réserve opérationnelle</span></a><nav aria-label="Navigation principale"><a href="../index.html">Accueil</a><a href="../staff.html">Staff</a></nav></header>
  <main class="workspace scan-workspace">
    <div class="page-heading"><div><p class="eyebrow">RETROUVER UN ARTICLE</p><h1>Scanner</h1></div><a class="button" href="inventaire.html">Retour à l’inventaire</a></div>
    <p id="catalog-status" class="muted" role="status" style="margin-top:20px">Connexion au catalogue…</p>
    <section class="scanner-card" aria-label="Lecture de codes-barres">
      <div id="reader" class="camera-reader"></div>
      <div class="scanner-actions"><button id="start" class="button primary" disabled>Démarrer le scan</button><button id="stop" class="button" hidden>Arrêter</button><button id="torch" class="button" hidden>Activer la lampe</button></div>
      <p id="scan-status" class="notice" role="status">Le scanner utilise le catalogue de l’inventaire.</p>
      <form id="manual-form" class="manual-scan"><label for="manual-code">Saisir un code-barres</label><div class="manual-row"><input id="manual-code" type="text" inputmode="numeric" autocomplete="off" maxlength="160" required placeholder="Numéro du code-barres"><button id="search-code" class="button" disabled>Rechercher</button></div></form>
    </section>
    <section id="results" class="scanner-card" hidden aria-live="polite"></section>
  </main>
</body>
</html>
